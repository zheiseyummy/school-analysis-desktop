<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="本地单用户学情分析系统"
    />
    <meta
      name="keywords"
      content="成绩管理,学情分析"
    />
    <title>初中学情分析系统</title>
  </head>

  <body>
    <div id="app">
      <div class="loader"></div>
    </div>
    <script>
      // Vite's source entry cannot run from file:// (ES modules and /src URLs
      // need an HTTP origin). Show an actionable message instead of a spinner.
      if (window.location.protocol === "file:") {
        document.getElementById("app").innerHTML =
          '<div style="max-width:560px;padding:32px;font:16px/1.8 system-ui;color:#334155;text-align:center">' +
          '<h2 style="margin:0 0 12px;color:#0f766e">请通过本地启动脚本打开</h2>' +
          '<p>不能直接双击这个 index.html。请运行项目根目录的“启动本地前端.bat”，再访问 <code>http://127.0.0.1:3000</code>。</p>' +
          '</div>';
      }
    </script>
  </body>
  <script type="module" src="/src/main.ts"></script>

  <style>
    html,
    body,
    #app {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .loader {
      position: relative;
      width: 50px;
      aspect-ratio: 1.154;
      background: conic-gradient(
        from 120deg at 50% 64%,
        #0000,
        #25b09b 1deg 120deg,
        #0000 121deg
      );
      animation: l27-0 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
    }

    .loader::before,
    .loader::after {
      position: absolute;
      inset: 0;
      content: "";
      background: inherit;
      transform-origin: 50% 66%;
      animation: l27-1 1.5s infinite;
    }

    .loader::after {
      --s: -1;
    }

    @keyframes l27-0 {
      0%,
      30% {
        transform: rotate(0);
      }

      70% {
        transform: rotate(120deg);
      }

      70.01%,
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes l27-1 {
      0% {
        transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
      }

      30%,
      70% {
        transform: rotate(calc(var(--s, 1) * 120deg))
          translate(calc(var(--s, 1) * -5px), 10px);
      }

      100% {
        transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
      }
    }
  </style>
</html>
