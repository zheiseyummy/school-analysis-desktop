# Local-only backend for the desktop edition.
server:
  address: 127.0.0.1
  port: 8989

spring:
  application:
    name: score-analysis-local
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${LOCAL_DB_URL:jdbc:sqlite:./data/school.db}
    username:
    password:
  sql:
    init:
      mode: never

mybatis-plus:
  global-config:
    db-config:
      id-type: none
  configuration:
    map-underscore-to-camel-case: true

# Files are stored locally; no remote object-storage credentials are read.
oss:
  type: local
  local:
    directory: files
